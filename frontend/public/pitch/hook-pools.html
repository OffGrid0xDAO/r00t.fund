// ---- topo backdrop ----
const tc=document.getElementById('topo'), tx=tc.getContext('2d');
function resize(){tc.width=innerWidth*devicePixelRatio;tc.height=innerHeight*devicePixelRatio;tx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
addEventListener('resize',resize); resize();
let ph=0;
function topo(){ const W=innerWidth,H=innerHeight; tx.clearRect(0,0,W,H); const cx=W*.5,cy=H*.52; ph+=0.0016; tx.lineWidth=1;
  for(let k=0;k<26;k++){ const base=60+k*34; tx.beginPath();
    for(let a=0;a<=Math.PI*2+0.1;a+=0.12){ const r=base+26*Math.sin(a*3+ph*2+k*.5)+18*Math.cos(a*2-ph*3+k*.3);
      const x=cx+Math.cos(a)*r*1.35,y=cy+Math.sin(a)*r; a===0?tx.moveTo(x,y):tx.lineTo(x,y);} tx.closePath();
    tx.strokeStyle='rgba(214,254,81,'+(0.05+0.02*Math.sin(k+ph))+')'; tx.stroke(); }
  requestAnimationFrame(topo);
}
topo();

const SVGNS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);

// ---- live candles on the public card (data-driven, moving) ----
const candlesG=$('candlesL'); const CN=11, cx0=110, cw=(264-10)/CN; let cdata=[];
(function seed(){ let p=350; for(let i=0;i<CN;i++){ const o=p,c=o+(Math.random()-.5)*30; p=c; cdata.push({o,c}); } })();
const clampY=v=>Math.max(286,Math.min(374,v)); // keep candles in a clean band above the split bar
function drawCandles(formC){
  while(candlesG.firstChild)candlesG.removeChild(candlesG.firstChild);
  cdata.forEach((d,i)=>{ const o=clampY(d.o), c=clampY((i===CN-1&&formC!=null)?formC:d.c); const up=c<=o, col=up?'#7CFFB2':'#ff5c6c'; const x=cx0+i*cw+cw/2;
    const w=document.createElementNS(SVGNS,'line'); w.setAttribute('x1',x);w.setAttribute('x2',x);w.setAttribute('y1',Math.min(o,c)-7);w.setAttribute('y2',Math.max(o,c)+7);w.setAttribute('stroke',col);w.setAttribute('stroke-width','1.6');candlesG.appendChild(w);
    const b=document.createElementNS(SVGNS,'rect'); b.setAttribute('x',x-cw*.28);b.setAttribute('y',Math.min(o,c));b.setAttribute('width',cw*.42);b.setAttribute('height',Math.max(3,Math.abs(c-o)));b.setAttribute('rx','2');b.setAttribute('fill',col);
    if(i===CN-1){b.setAttribute('filter','drop-shadow(0 0 6px '+col+')');} candlesG.appendChild(b);
  });
}

// ---- particle stream (constant flow public → hook → private) ----
const streamG=$('stream'); const dots=[];
for(let i=0;i<9;i++){ const c=document.createElementNS(SVGNS,'circle'); c.setAttribute('r',4.5);c.setAttribute('fill','#D6FE51');c.setAttribute('opacity','.85'); streamG.appendChild(c); dots.push({el:c,p:i/9}); }

// ---- live treasury ----
let realTreas=0.27, shown=0;
(async()=>{ for(const u of ['https://sepolia.drpc.org','https://ethereum-sepolia-rpc.publicnode.com']){ try{
  const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_getBalance',params:['0xBe196EEfCD38593a681f906F11fa4832889e96F5','latest']})});
  const j=await r.json(); if(j.result){realTreas=Number(BigInt(j.result))/1e18;break;} }catch(e){} } })();

const hook=$('hookNode'),coin=$('coin'),privRing=$('privRing'),pubRing=$('pubRing'),rebalTag=$('rebalTag');
const segA=$('segA'),segB=$('segB'),rvR00T=$('rvR00T'),rvETH=$('rvETH'),treasVal=$('treasVal'),spreadVal=$('spreadVal');
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

let pubR=.5,pubT=.5, privR=.6,privT=.6, spread=0,spreadT=0, tms=0;
function beat(){
  hook.classList.add('fire'); privRing.classList.add('on'); pubRing.classList.add('on'); rebalTag.classList.add('on');
  setTimeout(()=>{hook.classList.remove('fire');privRing.classList.remove('on');pubRing.classList.remove('on');rebalTag.classList.remove('on');},650);
  const d=.16+Math.random()*.16; privT=Math.max(.28,Math.min(.72, privR+(Math.random()<.5?-d:d))); pubT=Math.max(.3,Math.min(.7,1-privT));
  spread=6+Math.random()*8; spreadT=0;                 // spike, then converge to ~0
  // new candle: drop first, push a fresh one continuing the price
  const last=cdata[CN-1].c; cdata.shift(); cdata.push({o:last,c:last+(Math.random()-.5)*40});
  // coin to treasury
  coin.setAttribute('opacity','1'); const c0=performance.now();
  (function fly(now){ const k=Math.min(1,(now-c0)/750),e=ease(k);
    coin.setAttribute('cx',930+(712-930)*e); coin.setAttribute('cy',300+(112-300)*e-Math.sin(e*Math.PI)*60);
    if(k<1)requestAnimationFrame(fly); else {coin.setAttribute('opacity','0'); realTreas+=0.0009+Math.random()*0.002;} })(c0);
}
let lastBeat=0;
function frame(now){
  if(!lastBeat)lastBeat=now;
  if(now-lastBeat>2100){ lastBeat=now; beat(); }
  // stream flow
  // two lanes on the WIRES only (never over the centre logo): public→hook edge, hook edge→private
  dots.forEach((o,i)=>{ o.p=(o.p+0.006)%1; const left=i%2===0; const a=left?412:682, b=left?520:726;
    o.el.setAttribute('cx', a+o.p*(b-a)); o.el.setAttribute('cy',330);
    o.el.setAttribute('opacity', (o.p<0.12||o.p>0.88)?0.25:0.9); });
  // ease bars toward targets + tiny idle oscillation
  tms+=0.03;
  pubR+=(pubT-pubR)*0.08; privR+=(privT-privR)*0.08;
  const wob=0.012*Math.sin(tms); const pr=Math.max(.05,Math.min(.95,privR+wob));
  const pt=266, aw=Math.max(30,Math.min(236,pt*pubR)); segA.setAttribute('width',aw);segB.setAttribute('x',104+aw+2);segB.setAttribute('width',pt-aw);
  rvR00T.setAttribute('width',Math.max(24,240*pr)); rvETH.setAttribute('width',Math.max(24,240*(1-pr)));
  // forming candle breathes toward its close
  const fc=cdata[CN-1]; drawCandles(fc.c + Math.sin(tms*1.5)*4);
  // spread eases to 0 (convergence)
  spread+=(spreadT-spread)*0.04; spreadVal.textContent = spread<0.25?'CONVERGED':spread.toFixed(2)+'%'; spreadVal.setAttribute('fill', spread<0.25?'#7CFFB2':'#F5F5F3');
  shown+=(realTreas-shown)*0.05; treasVal.textContent=shown.toFixed(3)+' Ξ';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
